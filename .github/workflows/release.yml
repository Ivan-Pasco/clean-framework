name: release

# Triggered by pushing a `v*` tag from comita.
# Publishes one archive per platform plus a `.sha256` sidecar per archive,
# matching the filename convention cln-install::channels parses:
#   clean-framework-<version>-<os>-<arch>.<ext>[.sha256]
#
# Manager installs these into ~/.cln/versions/framework/<version>/ and expects
# the binary inside to be named `clean-framework` (cln-shared's
# ToolchainKind::binary_name).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            os: macos
            arch: arm64
            target: aarch64-apple-darwin
            ext: tar.gz
          - runner: ubuntu-latest
            os: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - runner: windows-latest
            os: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
            ext: zip
    steps:
      - uses: actions/checkout@v4
        with:
          path: clean-framework

      # See ci.yml — the path dependency on cln-shared / cln-layout needs the
      # sibling checkout until those become git pins at M1. clean-manager is
      # private, so this uses a read-only SSH deploy key scoped to that one
      # repository, not a PAT.
      - name: check out clean-manager
        uses: actions/checkout@v4
        with:
          repository: Ivan-Pasco/clean-manager
          path: clean-manager
          ssh-key: ${{ secrets.CLEAN_MANAGER_DEPLOY_KEY }}

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: clean-framework
          key: ${{ matrix.target }}

      - name: build clean-framework
        working-directory: clean-framework
        run: cargo build --release --locked --target ${{ matrix.target }} -p framework-cli

      - name: derive version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "asset_base=clean-framework-${tag#v}-${{ matrix.os }}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: stage archive contents
        working-directory: clean-framework
        shell: bash
        run: |
          set -euo pipefail
          mkdir stage
          if [ "${{ matrix.os }}" = "windows" ]; then
            cp "target/${{ matrix.target }}/release/clean-framework.exe" stage/
          else
            cp "target/${{ matrix.target }}/release/clean-framework" stage/
            chmod +x stage/clean-framework
          fi

      - name: pack tar.gz
        if: matrix.ext == 'tar.gz'
        working-directory: clean-framework
        shell: bash
        run: |
          set -euo pipefail
          name="${{ steps.version.outputs.asset_base }}.tar.gz"
          tar -C stage -czf "$name" .
          shasum -a 256 "$name" | awk '{print $1"  "$2}' > "$name.sha256"
          ls -la "$name" "$name.sha256"

      - name: pack zip
        if: matrix.ext == 'zip'
        working-directory: clean-framework
        shell: pwsh
        run: |
          $name = "${{ steps.version.outputs.asset_base }}.zip"
          Compress-Archive -Path stage/* -DestinationPath $name
          $hash = (Get-FileHash -Algorithm SHA256 $name).Hash.ToLower()
          "$hash  $name" | Out-File -FilePath "$name.sha256" -Encoding ascii -NoNewline

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clean-framework-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            clean-framework/clean-framework-*.tar.gz
            clean-framework/clean-framework-*.tar.gz.sha256
            clean-framework/clean-framework-*.zip
            clean-framework/clean-framework-*.zip.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: list assets
        run: ls -la dist

      # Published with `gh` in a backoff loop rather than with
      # softprops/action-gh-release, whose retry is 3 attempts about a second
      # apart — under 4 seconds total. GitHub's release API returned 503 for
      # longer than that twice in one afternoon (during v0.1.4 verification and
      # again on the v0.1.5 release). Both times the build was fine and only
      # publishing failed, which costs a manual re-run and teaches everyone to
      # distrust a red release job.
      #
      # Backoff is 15s, 30s, 60s, 120s: long enough to outlast a transient
      # outage, bounded at ~4 minutes so a real failure (bad token, missing
      # asset) still surfaces quickly instead of hanging the job.
      - name: create github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          # Idempotent: a partially-succeeded earlier attempt (or a re-run of
          # this job) must upload the assets rather than fail on "already
          # exists".
          publish() {
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            else
              gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" \
                --title "$tag" --generate-notes
            fi
          }

          for delay in 0 15 30 60 120; do
            [ "$delay" -eq 0 ] || { echo "retrying in ${delay}s..."; sleep "$delay"; }
            if publish; then
              echo "published $tag"
              exit 0
            fi
            echo "publish attempt failed"
          done

          echo "::error::could not publish $tag after 5 attempts"
          exit 1

      # The upload path above can succeed per-asset while leaving the release
      # short of what was built, so the end state is asserted rather than
      # inferred from the publish step's exit code. A green release job that
      # published nothing is worse than a red one.
      - name: verify the release carries every asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          expected=$(ls dist | wc -l | tr -d ' ')
          actual=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets | length')

          echo "$tag carries $actual of $expected expected asset(s)"
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::release $tag has $actual assets, expected $expected"
            exit 1
          fi
