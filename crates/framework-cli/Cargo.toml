[package]
name = "framework-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The clean-framework binary: argv adapter over framework-core."

[[bin]]
name = "clean-framework"
path = "src/main.rs"

[dependencies]
framework-core = { workspace = true }
framework-compiler-driver = { workspace = true }
framework-scaffold = { workspace = true }
clap = { workspace = true }
semver = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Integration tests read the produced .clapp back, as a consumer would.
zip = { version = "2", default-features = false, features = ["deflate"] }
framework-package = { workspace = true }
toml = { workspace = true }
tempfile = { workspace = true }
sha2 = { workspace = true }
# Proves the archived component would actually instantiate — the check the
# runtime would otherwise be the first to perform, long after packaging.
wasmparser = { workspace = true }
